<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASE — Shared Document</title>
<link rel="icon" type="image/svg+xml" href="assets/base-logo.svg?v=20260718">
<link rel="stylesheet" href="base.css">
<style>
  .viewerbar { position:sticky; top:76px; z-index:20; display:flex; gap:7px; align-items:center; padding:9px max(12px,calc((100% - 8.5in)/2)); background:rgba(255,255,255,.96); color:#454247; border-bottom:1px solid #d9d6d2; backdrop-filter:blur(8px); }
  .viewerbar strong { margin-right:auto; font:500 10px/1 var(--sans); }
  .viewerbar button,.viewerbar a { padding:8px 10px; border:1px solid #d7d4d0; border-radius:3px; background:#fff; color:#49464b; text-decoration:none; cursor:pointer; font:500 9px/1 var(--sans); }
  .viewerbar .accent { background:var(--accent); border-color:var(--accent); }
  .fill-status { padding:4px 8px; border-radius:10px; font:600 8px/1 var(--sans); text-transform:uppercase; letter-spacing:.04em; background:#eeece8; color:#6b6870; }
  .fill-status[data-state="filled"] { background:#e7f0e9; color:#2f6b45; }
  #root { padding-top:20px; }
  .error { width:min(620px,calc(100% - 32px)); margin:60px auto; padding:24px; background:#fff; box-shadow:0 2px 26px rgba(0,0,0,.13); }
  @media (max-width:620px) { .viewerbar { top:126px; overflow-x:auto; } }
  @media print { .viewerbar,.app-topbar { display:none; } #root { padding:0; } }
</style>
</head>
<body>
<header class="app-topbar">
  <a class="app-brand" href="/dashboard" aria-label="Return to BASE workspace"><img src="assets/base-logo.svg?v=20260718" alt="BASE"></a>
  <span class="app-divider" aria-hidden="true"></span>
  <nav class="app-crumbs" aria-label="Breadcrumb"><a href="/library">Documents</a><i>/</i><span>Controlled record</span></nav>
  <form class="global-search" action="/library" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg><label class="sr-only" for="viewerSearch">Search the document workspace</label><input id="viewerSearch" name="q" type="search" placeholder="Search documents, templates, or records"></form>
  <button class="user-placeholder" type="button" title="User sign in will be added later">User</button>
</header>
<div class="viewerbar"><strong id="label">Shared BASE document</strong><span id="fillStatus" class="fill-status" hidden></span><a id="editLink" href="builder.html">Edit a copy</a><button id="resetAnswers" hidden>Reset answers</button><button id="answers" hidden>Export answers</button><button id="download">Export backup</button><button class="accent" onclick="window.print()">Export PDF</button></div>
<main id="root"></main>
<script src="engine.js"></script>
<script src="form-fill.js"></script>
<script src="library-api.js"></script>
<script src="global-search.js"></script>
<script>
(async function () {
  function decode(payload) {
    const padded = payload.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((payload.length + 3) % 4);
    const binary = atob(padded); const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function download(name, value) {
    const blob = new Blob([JSON.stringify(value, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 500);
  }
  function updateFillStatus(fill) {
    const status = document.getElementById("fillStatus");
    if (!fill) { status.hidden = true; return; }
    status.hidden = false;
    const filled = !fill.isEmpty();
    status.dataset.state = filled ? "filled" : "empty";
    status.textContent = filled ? "Answers saved" : "Not yet filled";
  }
  try {
    const id = new URLSearchParams(location.search).get("id");
    const match = location.hash.match(/^#d=(.+)$/);
    if (!id && !match) throw new Error("No shared document was included in this link.");
    const record = id ? await BASE_LIBRARY.getDocument(id) : null;
    const definition = record ? record.definition : decode(match[1]);
    const root = document.getElementById("root");
    root.innerHTML = BASE.render(definition);
    requestAnimationFrame(() => { BASE.paginate(root); BASE.updatePackageIndex(root); });
    document.getElementById("label").textContent = definition.title || "Shared BASE document";
    document.title = `BASE — ${definition.title || "Shared Document"}`;
    document.getElementById("editLink").href = id ? BASE_LIBRARY.editUrl(id, BASE_LIBRARY.editKey(id)) : `builder.html#d=${match[1]}`;
    document.getElementById("editLink").textContent = id && BASE_LIBRARY.editKey(id) ? "Edit document" : "Edit a copy";
    document.getElementById("download").onclick = () => download(`${definition.no || "BASE-document"}.json`, definition);

    const targets = BASE.formFillTargets(definition);
    if (targets.length) {
      const storageKey = `viewer:${id || match[1]}`;
      const fill = BASE_FILL.attach(root, definition, storageKey);
      updateFillStatus(fill);
      root.addEventListener("input", () => updateFillStatus(fill));
      root.addEventListener("change", () => updateFillStatus(fill));

      const answers = document.getElementById("answers");
      answers.hidden = false;
      answers.onclick = () => download(`${definition.no || "form"}-answers.json`, fill.flush());

      const resetAnswers = document.getElementById("resetAnswers");
      resetAnswers.hidden = false;
      resetAnswers.onclick = () => {
        if (!window.confirm("Clear all answers on this form? This cannot be undone.")) return;
        fill.reset();
        updateFillStatus(fill);
      };
    }
    window.addEventListener("beforeprint", () => { BASE.paginate(root); BASE.updatePackageIndex(root); });
  } catch (error) {
    document.getElementById("root").innerHTML = `<div class="error"><h1>Document unavailable</h1><p>${BASE.esc(error.message)}</p></div>`;
    document.getElementById("download").disabled = true;
  }
})();
</script>
</body>
</html>
