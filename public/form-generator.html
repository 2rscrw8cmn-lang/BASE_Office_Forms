<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASE — Fill & Export</title>
<link rel="icon" type="image/svg+xml" href="assets/base-logo.svg?v=20260718">
<link rel="stylesheet" href="base.css">
<style>
  .usebar { position:sticky; top:76px; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:7px; width:8.5in; max-width:calc(100% - 24px); margin:14px auto; padding:9px; background:rgba(255,255,255,.96); border:1px solid #d9d6d2; border-radius:5px; backdrop-filter:blur(8px); }
  .usebar a,.usebar button,.usebar select { padding:8px 10px; border:1px solid #d7d4d0; border-radius:3px; background:#fff; color:#49464b; text-decoration:none; font:500 9px/1 var(--sans); cursor:pointer; }
  .usebar select { min-width:150px; text-transform:none; }
  .usebar .spacer { flex:1; } .usebar .accent { background:var(--accent); border-color:var(--accent); color:#fff; }
  #notice { width:8.5in; max-width:calc(100% - 24px); margin:0 auto 10px; color:#777; font:500 9px/1.4 var(--code); }
  .fill-status { padding:4px 8px; border-radius:10px; font:600 8px/1 var(--sans); text-transform:uppercase; letter-spacing:.04em; background:#eeece8; color:#6b6870; }
  .fill-status[data-state="filled"] { background:#e7f0e9; color:#2f6b45; }
  @media (max-width:620px) { .usebar { top:126px; } }
  @media print { .usebar,#notice,.app-topbar { display:none; } }
</style>
</head>
<body>
<header class="app-topbar">
  <a class="app-brand" href="/dashboard" aria-label="Return to BASE workspace"><img src="assets/base-logo.svg?v=20260718" alt="BASE"></a>
  <span class="app-divider" aria-hidden="true"></span>
  <nav class="app-crumbs" aria-label="Breadcrumb"><a href="/library">Documents</a><i>/</i><span>Fill &amp; Export</span></nav>
  <form class="global-search" action="/library" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg><label class="sr-only" for="fillSearch">Search the document workspace</label><input id="fillSearch" name="q" type="search" placeholder="Search documents, templates, or records"></form>
  <button class="user-placeholder" type="button" title="User sign in will be added later">User</button>
</header>
<div class="usebar">
  <a href="builder.html">Studio</a>
  <select id="librarySelect"><option value="">Shared form library</option></select><button id="openSaved">Open</button>
  <button id="loadDefinition">Import form backup</button><span class="spacer"></span>
  <button id="loadAnswers">Import answers</button><button id="resetAnswers" hidden>Reset answers</button><button id="copySpec">Copy AI fill spec</button><button id="downloadAnswers">Export answers</button><button class="accent" onclick="window.print()">Export PDF</button>
  <span id="fillStatus" class="fill-status" hidden></span>
</div>
<div id="notice">Load any form definition created in the studio, then fill it here or import an AI answer file.</div>
<main id="root"></main>
<script src="engine.js"></script>
<script src="form-fill.js"></script>
<script src="library-api.js"></script>
<script src="global-search.js"></script>
<script>
(function () {
  let definition = BASE.fromTemplate("authorization");
  let fill = null;

  function clean(value) { const copy = BASE.clone(value); delete copy._ready; delete copy._schema; return copy; }
  function storageKeyFor(def) { return `formgen:${def.no || "draft"}`; }
  function updateFillStatus() {
    const status = document.getElementById("fillStatus");
    if (!fill) { status.hidden = true; return; }
    status.hidden = false;
    const filled = !fill.isEmpty();
    status.dataset.state = filled ? "filled" : "empty";
    status.textContent = filled ? "Answers saved" : "Not yet filled";
  }
  function render() {
    const root = document.getElementById("root");
    if (fill) { fill.detach(); fill = null; }
    root.innerHTML = BASE.render(definition);
    requestAnimationFrame(() => { BASE.paginate(root); BASE.updatePackageIndex(root); });
    const targets = BASE.formFillTargets(definition);
    const resetAnswers = document.getElementById("resetAnswers");
    if (targets.length) {
      document.getElementById("notice").textContent = definition.kind === "form"
        ? `${definition.no || "Form"} — fields can be typed here or populated from an AI answer JSON file.`
        : `${definition.no || "Package"} — the fillable forms inside this package can be typed here or populated from an AI answer JSON file.`;
      fill = BASE_FILL.attach(root, definition, storageKeyFor(definition));
      resetAnswers.hidden = false;
      root.addEventListener("input", updateFillStatus);
      root.addEventListener("change", updateFillStatus);
    } else {
      document.getElementById("notice").textContent = "This is not a fillable form, but it can be reviewed and exported as PDF.";
      resetAnswers.hidden = true;
    }
    updateFillStatus();
  }
  function prepared() { return BASE.prepareForm(definition); }
  function filePicker(callback) {
    const input = document.createElement("input"); input.type = "file"; input.accept = ".json,application/json";
    input.onchange = () => { const reader = new FileReader(); reader.onload = () => { try { callback(JSON.parse(reader.result)); } catch (error) { alert(`Could not read JSON: ${error.message}`); } }; reader.readAsText(input.files[0]); };
    input.click();
  }
  function download(name, data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500);
  }
  async function refreshLibrary() {
    try {
      const items = await BASE_LIBRARY.listDocuments({ kind: "form" });
      document.getElementById("librarySelect").innerHTML = `<option value="">Shared form library</option>` + items.map(item => `<option value="${BASE.esc(item.id)}">${BASE.esc(item.title)} (${BASE.esc(item.no)})</option>`).join("");
    } catch (error) { document.getElementById("notice").textContent = `Shared library unavailable: ${error.message}`; }
  }
  document.getElementById("openSaved").onclick = async () => {
    const id = document.getElementById("librarySelect").value; if (!id) return;
    try { const item = await BASE_LIBRARY.getDocument(id); definition = BASE.clone(item.definition); render(); }
    catch (error) { document.getElementById("notice").textContent = `Could not open form: ${error.message}`; }
  };
  document.getElementById("loadDefinition").onclick = () => filePicker(data => { definition = data.definition || data; render(); });
  document.getElementById("loadAnswers").onclick = () => filePicker(data => {
    BASE_FILL.apply(document.getElementById("root"), definition, data);
    if (fill) fill.flush();
    updateFillStatus();
  });
  document.getElementById("downloadAnswers").onclick = () => download(`${definition.no || "form"}-answers.json`, fill ? fill.flush() : BASE_FILL.collect(document.getElementById("root"), definition));
  document.getElementById("resetAnswers").onclick = () => {
    if (!fill) return;
    if (!window.confirm("Clear all answers in this form? This cannot be undone.")) return;
    fill.reset();
    updateFillStatus();
  };
  document.getElementById("copySpec").onclick = async () => {
    if (definition.kind !== "form") return alert("Load a form definition first.");
    const fields = prepared()._schema;
    const prompt = `Complete BASE form ${definition.no} — ${definition.title}. Return ONLY JSON in this shape: {"form":"${definition.no}","answers":{<field id>:<value>}}. Use arrays for choose_any fields. Leave unknown values empty.\n\nFIELDS:\n${JSON.stringify(fields, null, 2)}\n\nFORM CONTEXT:\n${JSON.stringify(clean(definition), null, 2)}`;
    try { await navigator.clipboard.writeText(prompt); alert("AI fill spec copied."); } catch (_) { window.prompt("Copy this AI fill spec:", prompt); }
  };
  window.addEventListener("beforeprint", () => { BASE.paginate(document.getElementById("root")); BASE.updatePackageIndex(document.getElementById("root")); });
  refreshLibrary(); render();
})();
</script>
</body>
</html>
