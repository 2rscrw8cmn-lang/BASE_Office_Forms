<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASE — Forms</title>
<link rel="stylesheet" href="base.css">
</head>
<body>

<!-- ============================================================
     FORM DEFINITIONS  — the only thing you edit to add a form.
     Field building blocks:
       fields: [[label, width], …]              → write-in boxes
       checks: […]  (+ single:true for "pick one", cols:N for grid)
       sign:   [[label, width], …]              → signature row
       row:    [ {…}, {…} ]                     → two sections side by side
       footnotes: […]
     Every field gets a stable id automatically (used for fill/agent).
     ============================================================ -->
<script>
const ORG = "Office Process &amp; Compliance Division";

const FORMS = [
  {
    no: "RR-1",
    title: "Restroom Request Authorization",
    sub: "Submit prior to departure from assigned workstation. Retain duplicate for records.",
    control: { Revision:"4.2", Effective:"2026-01-15", Classification:"Internal", "Doc. Control":"BASE-FAC-RR-1" },
    sections: [
      { name:"Requestor Identification", req:"REQUIRED",
        fields:[ ["Employee Name",2.2], ["Employee ID",1], ["Date",1], ["Time of Request · 24-HR",1.3] ] },
      { row:[
        { name:"Type of Visit", req:"SELECT ONE", single:true,
          checks:["Standard","Expedited","Emergency †"] },
        { name:"Anticipated Duration", req:"SELECT ONE", single:true, cols:2,
          checks:["Under 2 min","2–5 min","5–10 min","Over 10 min ‡"] },
      ]},
      { name:"Supervisor Authorization", req:"REQUIRED",
        sign:[ ["Supervisor Signature",2], ["Badge No.",1], ["Time Authorized",1] ] },
    ],
    footnotes:[
      "† Emergency requests may proceed pending authorization; retroactive approval required within one business day.",
      "‡ Durations over 10 minutes require secondary review under Form RR-1M.",
    ],
  },

  {
    no: "TB-1",
    title: "Toolbox Talk Attendance Record",
    sub: "Complete at the start of each safety briefing. File with the daily report.",
    control: { Revision:"1.0", Effective:"2026-07-17", Classification:"Internal", "Doc. Control":"BASE-SAF-TB-1" },
    sections: [
      { name:"Briefing Details", req:"REQUIRED",
        fields:[ ["Project / Job No.",2], ["Date",1], ["Location",2], ["Presenter",1.5] ] },
      { name:"Topic Covered", req:"REQUIRED",
        fields:[ ["Topic",3], ["Duration (min)",1] ] },
      { name:"Hazards Discussed", req:"SELECT ANY", cols:3,
        checks:["Fall protection","Electrical","Housekeeping","PPE","Heat / cold","Silica dust","Ladders","Traffic","Other"] },
      { name:"Supervisor Sign-Off", req:"REQUIRED",
        sign:[ ["Supervisor Signature",2], ["Date",1] ] },
    ],
  },
];
</script>

<div id="root"></div>

<!-- ============================================================
     ENGINE — prepares ids, renders, fills, exports. Rarely touched.
     ============================================================ -->
<script>
/* ---- id helpers ---- */
const slug = s => String(s).toLowerCase().replace(/[†‡]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
function prepare(f){
  if (f._ready) return f;
  const seen = {}, schema = [];
  const uid = b => { b = b||"field"; seen[b]=(seen[b]||0)+1; return seen[b]>1 ? b+"_"+seen[b] : b; };
  const walk = s => {
    if (s.row){ s.row.forEach(walk); return; }
    if (s.fields) s.fields = s.fields.map(([label,w,ex]) => {
      const id = uid(slug(ex||label)); schema.push({id,type:"text",label}); return {label,w:w||1,id};
    });
    if (s.sign) s.sign = s.sign.map(([label,w,ex]) => {
      const id = uid(slug(ex||label)); schema.push({id,type:"text",label}); return {label,w:w||1,id};
    });
    if (s.checks){
      s._gid = uid(slug(s.name||"choice"));
      s._opts = s.checks.map(c => c.replace(/[†‡]\s*$/,"").trim());
      schema.push({id:s._gid, type:s.single?"choose_one":"choose_any", label:s.name, options:s._opts});
    }
  };
  f.sections.forEach(walk);
  f._schema = schema; f._ready = true; return f;
}

/* ---- render pieces ---- */
function ctrlGrid(no, control){
  const cells = [["Form No.",no], ...Object.entries(control||{})];
  return `<div class="doc-control" style="--dc-cols:${cells.length}">` +
    cells.map(([l,v]) => `<div class="dc-cell"><div class="dc-label">${l}</div><div class="dc-val">${v}</div></div>`).join("") +
    `</div>`;
}
function head(f){
  return `<header>
    <div class="doc-top">
     <img class="doc-logo" src="assets/base-logo.svg" alt="BASE">
      <div class="doc-org">${ORG}<br>Controlled Document — Do Not Reproduce</div>
    </div>
    <div class="rule"></div>
    <div class="form-tag">Form ${f.no}</div>
    <h1 class="form-title">${f.title}</h1>
    ${f.sub ? `<p class="form-sub">${f.sub}</p>` : ""}
    ${ctrlGrid(f.no, f.control)}
  </header>`;
}
function fieldsBlock(fields, tall){
  const tpl = fields.map(x => x.w+"fr").join(" ");
  return `<div class="grid" style="--tpl:${tpl};">` + fields.map(x =>
    `<div class="field${tall?" field-tall":""}"><div class="field-label">${x.label}</div>` +
    (tall ? `<textarea class="ftx" name="${x.id}"></textarea>` : `<input class="fin" name="${x.id}">`) +
    `</div>`).join("") + `</div>`;
}
function checksBlock(s){
  const cls = s.cols ? `check-box cols" style="--ccols:${s.cols}` : "check-box";
  const type = s.single ? "radio" : "checkbox";
  return `<div class="${cls}">` + s.checks.map((c,i) => {
    const m = c.match(/([†‡])\s*$/); const txt = c.replace(/[†‡]\s*$/,"").trim();
    const dag = m ? `<sup class="dagger">${m[1]}</sup>` : "";
    return `<label class="check"><input type="${type}" name="${s._gid}" value="${txt}"><span class="box"></span>${txt}${dag}</label>`;
  }).join("") + `</div>`;
}
function signBlock(sign){
  const tpl = sign.map(x => x.w+"fr").join(" ");
  return `<div class="sign-grid" style="--sign-tpl:${tpl};">` + sign.map(x =>
    `<div class="sign"><div class="field-label">${x.label}</div><input class="fin" name="${x.id}"></div>`
  ).join("") + `</div>`;
}
function body(s){
  if (s.fields) return fieldsBlock(s.fields, s.tall);
  if (s.checks) return checksBlock(s);
  if (s.sign)   return signBlock(s.sign);
  return "";
}
function section(s, ctr){
  if (s.row) return `<div class="grid" style="--cols:2; --gap:14px;">` + s.row.map(x=>section(x,ctr)).join("") + `</div>`;
  const n = String(++ctr.n).padStart(2,"0");
  return `<section class="section">
    <div class="sec-head"><div class="sec-no">${n}</div><div class="sec-name">${s.name}</div>${s.req?`<div class="sec-req">${s.req}</div>`:""}</div>
    ${body(s)}
  </section>`;
}
function renderForm(f){
  prepare(f); const ctr = {n:0};
  const foot = (f.footnotes||[]).length ? `<div class="footnote">${f.footnotes.join("<br>")}</div>` : "";
  const bar = `<div class="toolbar">
    <button class="btn ghost" onclick="location.hash='#/'">← Register</button>
    <span class="sp"></span>
    <button class="btn ghost" onclick="loadAnswers('${f.no}')">Load answers</button>
    <button class="btn ghost" onclick="copySpec('${f.no}')">Copy AI fill-spec</button>
    <button class="btn" onclick="downloadAnswers('${f.no}')">Download answers</button>
    <button class="btn accent" onclick="window.print()">Print / Save PDF</button>
  </div>`;
  return bar + `<div class="sheet" id="sheet-${f.no}">${head(f)}${f.sections.map(s=>section(s,ctr)).join("")}${foot}</div>`;
}
function renderRegister(){
  const rows = FORMS.map(f => `<a class="formrow" href="#/${f.no}"><span class="no">${f.no}</span><span class="nm">${f.title}</span></a>`).join("");
  return `<div class="sheet">
    <header>
       <div class="doc-top"><img class="doc-logo" src="assets/base-logo.svg" alt="BASE">
        <div class="doc-org">${ORG}<br>Controlled Document — Do Not Reproduce</div></div>
      <div class="rule"></div>
      <div class="form-tag">Master Register · MR-0</div>
      <h1 class="form-title">Office Process Forms — Controlled Index</h1>
      <p class="form-sub">Select a form to open it. Fill it in here, hand off the link, print it, or load an agent's answers.</p>
    </header>
    <div style="margin-top:20px;">${rows}</div>
  </div>`;
}

/* ---- fill / export ---- */
function byNo(no){ return FORMS.find(f=>f.no===no); }
function applyAnswers(f, values){
  prepare(f);
  f._schema.forEach(fld => {
    const v = values[fld.id]; if (v==null) return;
    if (fld.type==="text"){ const el=document.querySelector(`[name="${fld.id}"]`); if(el) el.value=v; }
    else {
      const want = Array.isArray(v) ? v : [v];
      document.querySelectorAll(`[name="${fld.id}"]`).forEach(el => { el.checked = want.includes(el.value); });
    }
  });
}
function collectAnswers(f){
  prepare(f); const out = {};
  f._schema.forEach(fld => {
    if (fld.type==="text"){ const el=document.querySelector(`[name="${fld.id}"]`); out[fld.id]=el?el.value:""; }
    else if (fld.type==="choose_one"){ const el=document.querySelector(`[name="${fld.id}"]:checked`); out[fld.id]=el?el.value:""; }
    else { out[fld.id]=[...document.querySelectorAll(`[name="${fld.id}"]:checked`)].map(e=>e.value); }
  });
  return out;
}
function downloadAnswers(no){
  const f = byNo(no); const data = { form:no, answers: collectAnswers(f) };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `${no}-answers.json`; a.click();
}
function loadAnswers(no){
  const inp = document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange = e => { const r=new FileReader(); r.onload = () => {
    try { const d = JSON.parse(r.result); applyAnswers(byNo(no), d.answers||d); }
    catch(err){ alert("Couldn't read that JSON: "+err.message); }
  }; r.readAsText(e.target.files[0]); };
  inp.click();
}
function copySpec(no){
  const f = byNo(no); prepare(f);
  const lines = f._schema.map(s => {
    if (s.type==="text") return `- ${s.id} (text): ${s.label}`;
    if (s.type==="choose_one") return `- ${s.id} (choose ONE of: ${s.options.join(", ")}): ${s.label}`;
    return `- ${s.id} (choose ANY of: ${s.options.join(", ")}) → array: ${s.label}`;
  }).join("\n");
  const spec =
`Fill out BASE form ${no} — "${f.title}".
Return ONLY a JSON object: { "form": "${no}", "answers": { <field id>: <value> } }.
For "choose ANY" fields the value is an array of the chosen labels. Leave unknown fields as "".

Fields:
${lines}`;
  navigator.clipboard.writeText(spec).then(
    () => alert("AI fill-spec copied. Paste it to your agent; load the JSON it returns with “Load answers.”"),
    () => { prompt("Copy this spec for your agent:", spec); }
  );
}

/* ---- routing ---- */
function route(){
  const no = decodeURIComponent((location.hash.match(/^#\/(.+)$/)||[])[1] || "");
  const f = no && byNo(no);
  document.getElementById("root").innerHTML = f ? renderForm(f) : renderRegister();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
