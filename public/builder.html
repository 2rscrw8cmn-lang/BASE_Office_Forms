<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASE — Document Studio</title>
<link rel="icon" type="image/svg+xml" href="assets/base-logo.svg?v=20260718">
<link rel="stylesheet" href="base.css">
<style>
  body { height:100vh; overflow:hidden; background:#f4f3f1; }
  .studio-topbar { min-height:72px; }

  .legacy-shell-return { grid-column:6; min-height:40px; display:inline-flex; align-items:center; padding:0 14px; color:var(--accent); border:1px solid #d9d5d1; border-radius:4px; text-decoration:none; font:600 9px/1 var(--sans); white-space:nowrap; }

  .studio-commandbar button { min-height:36px; padding:0 12px; border:1px solid #d8d5d1; border-radius:4px; background:#fff; color:#454247; cursor:pointer; font:500 9px/1 var(--sans); white-space:nowrap; }

  .studio-commandbar .danger-command { color:#982329; border-color:#d8b9ba; background:#fffafa; }
  .studio-commandbar .danger-command:hover { color:#fff; border-color:#982329; background:#982329; }
  .studio-commandbar button:focus-visible, .studio-commandbar select:focus-visible { outline:2px solid #7a1e22; outline-offset:2px; }
  .studio-commandbar .cmd-btn { display:inline-flex; align-items:center; gap:6px; }

  .studio-commandbar .cmd-primary { padding-inline:16px; font-weight:600; box-shadow:0 1px 2px rgba(122,30,34,.28); }

  .studio-commandbar .cmd-menu { position:absolute; top:calc(100% + 5px); left:0; z-index:40; min-width:212px; padding:5px; background:#fff; border:1px solid #d8d5d1; border-radius:6px; box-shadow:0 14px 40px rgba(28,26,25,.18); display:flex; flex-direction:column; gap:2px; }
  .cmd-menu-wrap.align-end .cmd-menu { left:auto; right:0; }
  .studio-commandbar .cmd-menu[hidden] { display:none; }
  .studio-commandbar .cmd-menu-item { display:flex; align-items:center; gap:9px; width:100%; min-height:34px; padding:0 11px; border:0; border-radius:4px; background:#fff; color:#454247; font:500 10px/1.2 var(--sans); text-align:left; white-space:nowrap; }
  .studio-commandbar .cmd-menu-item:hover, .studio-commandbar .cmd-menu-item:focus-visible { background:#f4f2f0; }
  .studio-commandbar .cmd-menu-item .cmd-ico { width:15px; height:15px; }
  .studio-commandbar .cmd-menu-item.danger-item { color:#982329; }
  .studio-commandbar .cmd-menu-item.danger-item:hover, .studio-commandbar .cmd-menu-item.danger-item:focus-visible { background:#982329; color:#fff; }
  .cmd-menu-divider { height:1px; margin:4px 6px; background:#e7e4e1; }
  .cmd-menu-divider[hidden] { display:none; }
  .app { display:grid; grid-template-columns:240px minmax(0, 1fr) 340px; height:calc(100vh - 130px); }
  .outline { min-width:0; overflow-y:auto; overflow-x:hidden; background:#fcfbfa; border-right:1px solid #dedbd7; }
  .inspector { min-width:0; overflow-y:auto; overflow-x:hidden; background:#fcfbfa; border-left:1px solid #dedbd7; }

  .studio-head .head-row { display:flex; align-items:baseline; gap:10px; }

  .draft-state { margin-top:7px; display:inline-flex; align-items:center; gap:6px; font:600 8px/1 var(--code); text-transform:uppercase; letter-spacing:.5px; color:#858286; }
  .draft-state::before { content:''; width:6px; height:6px; border-radius:50%; background:#b9b6b1; }
  .draft-state[data-state="saving"] { color:#8c6d1f; } .draft-state[data-state="saving"]::before { background:#d9a520; }
  .draft-state[data-state="saved"] { color:#267044; } .draft-state[data-state="saved"]::before { background:#2f9e63; }
  .draft-state[data-state="offline"] { color:#6f6c70; } .draft-state[data-state="offline"]::before { background:#9d9994; }

  .outline .panel, .inspector .panel { width:auto; margin:0; padding:19px 22px; border:0; border-bottom:1px solid #e7e4e1; background:transparent; }
  .panel h3,.collapsible summary { font:600 8px/1 var(--code); text-transform:uppercase; letter-spacing:1.1px; color:#6f6c70; margin:0 0 13px; }
  .collapsible summary { cursor:pointer; margin:0; list-style:none; }
  .collapsible summary::after { content:'+'; float:right; color:#969397; font-size:14px; }
  .collapsible[open] summary { margin-bottom:13px; } .collapsible[open] summary::after { content:'−'; }
  .lbl { display:block; margin:11px 0 5px; font:600 7px/1 var(--code); color:#858286; text-transform:uppercase; letter-spacing:.45px; }
  .in,.ta,.sel { width:100%; border:1px solid #d7d4d0; border-radius:3px; padding:8px 9px; color:var(--ink); background:#fff; font:400 11px/1.4 var(--sans); }
  .in:focus,.ta:focus,.sel:focus { outline:0; border-color:#9d9994; box-shadow:0 0 0 3px rgba(122,30,34,.045); }
  .ta { min-height:76px; resize:vertical; } .sel { height:34px; }
  .two,.color-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .color-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .input-group { min-width:0; }
  .toggle { display:flex; gap:8px; align-items:center; margin:10px 0; font:400 10px/1.35 var(--sans); color:#555258; }
  .toggle input { accent-color:var(--accent); } .toggle.compact { margin:0; min-width:105px; }
  .control-row { display:flex; align-items:center; gap:7px; margin:7px 0; }
  .control-row .in { flex:1; }
  .card { margin:12px 16px; padding:13px; border:1px solid #dedbd7; border-radius:5px; background:#fff; box-shadow:0 3px 12px rgba(42,39,36,.02); }
  .card-head { display:flex; align-items:center; gap:5px; margin-bottom:10px; }

  .spacer { flex:1; }
  .mini { width:27px; height:27px; border:1px solid #dbd8d4; background:#fff; border-radius:3px; cursor:pointer; color:#656267; }
  .mini:hover { border-color:#aaa6a2; background:#faf9f8; } .mini.del:hover,.danger:hover { background:#9b2328!important; color:#fff!important; }
  .field-editor { display:grid; grid-template-columns:1fr 52px 62px 62px 84px 64px 27px; gap:5px; align-items:center; margin:5px 0; }
  .field-editor .small { text-align:center; padding-inline:3px; }
  .addrow { margin-top:7px; padding:8px 10px; border:1px dashed #cda9ab; color:var(--accent); background:#fff; border-radius:3px; cursor:pointer; font:600 8px/1 var(--code); }
  .outline-list { padding-bottom:12px; }
  .outline-doc-header { width:calc(100% - 24px); margin:14px 12px 4px; padding:11px 12px; display:flex; align-items:center; gap:9px; border:1px solid #dedbd7; border-radius:5px; background:#fff; cursor:pointer; text-align:left; }
  .outline-doc-header.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .outline-doc-title { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#39373b; font:500 11px/1.3 var(--sans); }
  .outline-doc-meta { display:block; margin-top:2px; color:#8f8c90; font:600 7px/1 var(--code); text-transform:uppercase; letter-spacing:.5px; }
  .outline-row { margin:0 12px; display:flex; align-items:stretch; gap:4px; border:1px solid transparent; border-radius:5px; }
  .outline-row:hover { background:#f4f2f0; }
  .outline-row.selected { background:#fbf2f1; border-color:#e3b8b9; }
  .outline-row-body { flex:1; min-width:0; padding:8px 8px; display:flex; align-items:center; gap:7px; border:0; background:transparent; cursor:pointer; text-align:left; }
  .outline-no { flex:none; color:#a19d99; font:600 8px/1 var(--code); }
  .outline-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#4b484d; font:500 10px/1.2 var(--sans); }
  .outline-req { flex:none; margin-left:auto; padding:2px 6px; border-radius:3px; background:#fbf2f1; color:#9d2026; font:600 6.5px/1.4 var(--code); text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; }
  .outline-row-actions { flex:none; display:flex; align-items:center; gap:3px; padding:6px 6px 6px 0; opacity:0; transition:opacity .1s ease; }
  .outline-row:hover .outline-row-actions, .outline-row:focus-within .outline-row-actions { opacity:1; }
  .outline-row-actions .mini { width:22px; height:22px; }
  .outline-insert { width:calc(100% - 24px); margin:0 12px; height:9px; display:flex; align-items:center; justify-content:center; border:0; background:transparent; color:transparent; cursor:pointer; font:700 11px/1 var(--sans); }
  .outline-insert:hover, .outline-insert:focus-visible { height:18px; color:var(--accent); background:linear-gradient(#fff0,#fbf2f1 40%,#fbf2f1 60%,#fff0); }
  .package-tools { padding:16px 22px; }
  .inspector-item { padding:8px 22px 22px; }
  .inspector-item-head { display:flex; align-items:center; gap:6px; margin-bottom:13px; }
  .inspector-item-head .tag { color:#9d2026; background:#fbf2f1; padding:5px 8px; border-radius:3px; font:600 7px/1 var(--code); text-transform:uppercase; letter-spacing:.55px; }
  .addmenu { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; padding:0 20px 20px; }
  .block-group-title { grid-column:1/-1; margin:8px 0 0; color:#858286; font:600 7px/1 var(--code); text-transform:uppercase; letter-spacing:.85px; }
  .block-group-title:first-of-type { margin-top:3px; }
  .addmenu button { min-height:54px; padding:8px 9px; display:grid; grid-template-columns:25px minmax(0,1fr); gap:8px; align-items:center; border:1px solid #dcd9d5; background:#fff; border-radius:4px; cursor:pointer; text-align:left; color:#39373b; }
  .addmenu button strong { display:block; font:500 9px/1.2 var(--sans); }
  .addmenu .block-copy>span { display:block; margin-top:3px; color:#8a878b; font:400 7.5px/1.3 var(--sans); }
  .block-icon { width:25px; height:25px; display:grid; place-items:center; margin:0; color:#646166; border:1px solid #dfdcd8; border-radius:3px; background:#fbfaf9; }
  .block-icon svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.35; stroke-linecap:round; stroke-linejoin:round; }
  .addmenu button:hover { border-color:#b54a4e; background:#fdf9f8; }
  .addmenu button:hover .block-icon { color:#9d2026; border-color:#d9b5b6; background:#fff; }
  .preview-jump { outline:2px solid rgba(157,32,38,.55); outline-offset:5px; animation:preview-jump 1.35s ease both; }
  @keyframes preview-jump { 0%,100% { outline-color:transparent; } 18%,70% { outline-color:rgba(157,32,38,.55); } }
  .preview-selected { outline:2px solid var(--accent); outline-offset:4px; border-radius:2px; }
  .add-block-drawer[hidden] { display:none; }
  .add-block-drawer { position:fixed; inset:0; z-index:110; }
  .drawer-backdrop { position:absolute; inset:0; background:rgba(28,26,25,.28); }
  .drawer-panel { position:absolute; top:0; right:0; bottom:0; width:min(420px,100vw); background:#fcfbfa; box-shadow:-20px 0 50px rgba(25,23,22,.2); display:flex; flex-direction:column; overflow-y:auto; }
  .drawer-head { position:sticky; top:0; z-index:1; display:flex; align-items:center; padding:18px 20px; background:#fcfbfa; border-bottom:1px solid #e7e4e1; }
  .drawer-head h2 { margin:0; font:400 18px/1 Georgia,'Times New Roman',serif; }
  .drawer-head button { margin-left:auto; width:28px; height:28px; border:0; background:none; font-size:20px; cursor:pointer; color:#656267; }
  .add-block-drawer #blockSearch { margin:16px 20px 4px; width:calc(100% - 40px); }
  .wide-action,.modal-primary { padding:9px 11px; border:1px solid #d7d4d0; background:#fff; border-radius:3px; cursor:pointer; font:500 9px/1 var(--sans); }
  .wide-action:hover { border-color:var(--accent); color:var(--accent); } .wide-action { width:100%; }
  .micro { color:#8f8c90; font:400 9px/1.5 var(--sans); }
  .package-card strong { display:block; font:600 12px/1.3 var(--sans); } .package-card>span { display:block; margin-top:4px; font:500 8px/1 var(--code); color:#888; text-transform:capitalize; }
  .package-add-grid,.package-card-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:13px; }
  .package-add-grid button { min-height:38px; padding:8px; border:1px solid #d7d4d0; border-radius:3px; background:#fff; color:#4b484d; cursor:pointer; font:500 9px/1.25 var(--sans); }
  .package-add-grid button:hover { border-color:#b54a4e; color:#982329; background:#fdf9f8; }
  .package-card-actions .wide-action { margin:0; }
  .empty-state { margin:16px; padding:24px; text-align:center; color:#8e8b8f; border:1px dashed #d4d1cd; font:400 10px/1.5 var(--sans); }
  .modal { position:fixed; inset:0; z-index:100; } .modal[hidden] { display:none; }
  .modal-backdrop { position:absolute; inset:0; background:rgba(28,26,25,.38); backdrop-filter:blur(2px); }
  .modal-card { position:relative; width:min(820px,calc(100% - 32px)); max-height:82vh; overflow:auto; margin:9vh auto; background:#fff; border:1px solid #d8d5d1; border-radius:7px; box-shadow:0 24px 80px rgba(25,23,22,.22); padding:24px; }
  .modal-head { display:flex; align-items:center; margin-bottom:18px; } .modal-head h2 { margin:0; font:400 23px/1 Georgia,'Times New Roman',serif; } .modal-head button { margin-left:auto; border:0; background:none; font-size:22px; cursor:pointer; }

  .library-tools button { padding:8px 11px; border:1px solid #ddd; background:#fff; border-radius:3px; cursor:pointer; }
  .library-row { display:grid; grid-template-columns:minmax(0,1fr) repeat(4,auto); gap:7px; align-items:center; padding:12px 0; border-bottom:1px solid #ebe8e5; }

  .library-row button { padding:7px 9px; border:1px solid #ddd; background:#fff; border-radius:3px; cursor:pointer; }
  .package-template-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:16px; }
  .package-template-list button { min-height:60px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:16px; border:1px solid #ddd9d5; border-radius:4px; background:#fff; color:#3d3a3f; cursor:pointer; text-align:left; }
  .package-template-list button:hover { border-color:#b54a4e; background:#fdf9f8; }
  .package-template-list strong { font:500 11px/1.25 var(--sans); }
  .package-template-list span { color:#9d2026; font:500 8px/1 var(--code); white-space:nowrap; }
  .modal-text { width:100%; min-height:100px; padding:10px; border:1px solid #ccc; font:500 10px/1.5 var(--code); } .modal-text.tall { min-height:300px; }
  .modal-primary { margin-top:8px; background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:1180px) { .studio-commandbar .cmd-collapse .cmd-label, .studio-commandbar .cmd-collapse .cmd-caret { display:none; } .studio-commandbar .cmd-collapse.cmd-btn { width:36px; min-width:36px; padding:0; justify-content:center; gap:0; } }
  /* Below this width the inspector becomes an overlay drawer instead of a

  @media (max-width:1050px) {
    .app { grid-template-columns:220px minmax(0,1fr); }

  @media print { body { overflow:visible; } .app-topbar,.studio-commandbar,.preview-head { display:none!important; } .app { display:block; height:auto; } .outline,.inspector,.modal,.add-block-drawer { display:none!important; } .previewpane { overflow:visible; padding:0; background:#fff; } .previewscale { transform:none!important; width:100%!important; } }
</style>

<body>
<header class="app-topbar studio-topbar">
  <a class="app-brand" href="/dashboard" aria-label="Return to BASE workspace"><img src="assets/base-logo.svg?v=20260718" alt="BASE"></a>
  <span class="app-divider" aria-hidden="true"></span>
  <nav class="app-crumbs" aria-label="Breadcrumb"><a href="/library">Document Library</a><i>/</i><span>Studio</span></nav>
  <form class="global-search" action="/library" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
    <label class="sr-only" for="studioSearch">Search the document workspace</label><input id="studioSearch" name="q" type="search" placeholder="Search documents, templates, or records">
  </form>
  <a class="legacy-shell-return" href="/dashboard">Back to app</a>
</header>
<div class="studio-commandbar" role="toolbar" aria-label="Document Studio actions">
  <div class="command-group">
    <label class="sr-only" for="templateSelect">Document template</label>
    <select id="templateSelect" aria-label="Document template"></select>
    <button id="newButton" class="cmd-btn" type="button">
      <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M9 15h6"/><path d="M12 12v6"/></svg>
      <span class="cmd-label">Use template</span>
    </button>
    <div class="cmd-menu-wrap">
      <button id="moreActionsButton" class="cmd-btn cmd-icon-btn" type="button" data-menu aria-haspopup="true" aria-expanded="false" aria-controls="moreActionsMenu" aria-label="More actions" title="More actions">
        <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
      <div class="cmd-menu" id="moreActionsMenu" role="menu" aria-label="More actions" hidden>
        <button id="loadButton" class="cmd-menu-item" type="button" role="menuitem" title="Restore a portable document backup file">
          <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
          <span>Import backup</span>
        </button>
        <button id="downloadButton" class="cmd-menu-item" type="button" role="menuitem" title="Download a portable JSON backup">
          <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
          <span>Export backup</span>
        </button>
        <div class="cmd-menu-divider" role="separator" data-conditional-divider hidden></div>
        <button id="updateTemplateButton" class="cmd-menu-item" type="button" role="menuitem" title="Publish your changes as the new version of this template for everyone" hidden>
          <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          <span>Update template</span>
        </button>
        <button id="deleteButton" class="cmd-menu-item danger-item" type="button" role="menuitem" title="Delete the current document from the shared library" hidden>
          <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          <span>Delete document</span>
        </button>
      </div>
    </div>
  </div>
  <div class="command-group">
    <button id="libraryButton" class="cmd-btn cmd-collapse" type="button" aria-label="Controlled documents" title="Browse the shared controlled document library">
      <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
      <span class="cmd-label">Controlled documents</span>
    </button>
    <button id="shareButton" class="cmd-btn cmd-icon-btn" type="button" aria-label="Share document" title="Copy a shareable view and fill link">
      <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
    <div class="cmd-menu-wrap align-end">
      <button id="aiKitButton" class="cmd-btn cmd-collapse" type="button" data-menu aria-haspopup="true" aria-expanded="false" aria-controls="aiKitMenu" aria-label="AI Kit" title="AI handoff tools">
        <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 15.5A2 2 0 0 0 8.5 14L2.4 12.5a.5.5 0 0 1 0-1L8.5 10a2 2 0 0 0 1.4-1.4L11.5 2.4a.5.5 0 0 1 1 0L14 8.5a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/><path d="M20 3v4M22 5h-4M4 17v2M5 18H3"/></svg>
        <span class="cmd-label">AI Kit</span>
        <svg class="cmd-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="cmd-menu" id="aiKitMenu" role="menu" aria-label="AI Kit" hidden>
        <button id="aiButton" class="cmd-menu-item" type="button" role="menuitem" title="Copy an AI handoff kit for the current document">
          <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 15.5A2 2 0 0 0 8.5 14L2.4 12.5a.5.5 0 0 1 0-1L8.5 10a2 2 0 0 0 1.4-1.4L11.5 2.4a.5.5 0 0 1 1 0L14 8.5a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/><path d="M20 3v4M22 5h-4"/></svg>
          <span>Open AI Kit</span>
        </button>
        <button id="aiImportButton" class="cmd-menu-item" type="button" role="menuitem" title="Import an AI-generated document configuration">
          <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3M12 8v8M8.5 12h7"/></svg>
          <span>Import AI configuration</span>
        </button>
      </div>
    </div>
    <button id="printButton" class="cmd-btn cmd-collapse" type="button" aria-label="Export PDF" title="Export a print-ready PDF">
      <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
      <span class="cmd-label">Export PDF</span>
    </button>
    <button id="saveButton" class="cmd-btn cmd-primary accent" type="button" title="Save or update this document in the shared Cloudflare library">
      <svg class="cmd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
      <span class="cmd-label">Save to Library</span>
    </button>
  </div>
</div>
<div class="app">
  <section class="outline" aria-label="Document outline">
    <div class="studio-head"><div class="head-row"><strong>Outline</strong><span id="kindBadge"></span></div><div id="draftState" class="draft-state" data-state="draft" role="status">Draft</div></div>
    <div id="outline"></div>
  </section>
  <main class="previewpane"><div class="preview-head"><strong>Live preview</strong><span>Changes save locally</span></div><div class="previewscale" id="pv"></div></main>
  <aside class="inspector" aria-label="Inspector">
    <div class="studio-head inspector-head"><div class="head-row"><strong id="inspectorTitle">Document Settings</strong></div><button class="inspector-close" type="button" aria-label="Close inspector">×</button></div>
    <div id="inspector"></div>
  </aside>
</div>
<div class="add-block-drawer" id="addBlockDrawer" hidden>
  <div class="drawer-backdrop" data-action="close-drawer"></div>
  <div class="drawer-panel">
    <div class="drawer-head"><h2>Add a block</h2><button data-action="close-drawer" aria-label="Close">×</button></div>
    <input type="search" id="blockSearch" class="in" placeholder="Search blocks…" aria-label="Search blocks">
    <div id="blockCatalog" class="addmenu"></div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="modal-backdrop"></div><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button data-action="close-modal" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
<script src="engine.js"></script>
<script src="library-api.js"></script>
<script src="template-api.js"></script>
<script src="global-search.js"></script>
<script src="studio-toast.js"></script>
<script src="studio.js"></script>
</body>
</html>
