<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASE — Document Studio</title>
<link rel="icon" type="image/svg+xml" href="assets/base-logo.svg?v=20260718">
<link rel="stylesheet" href="base.css">
<style>
  body { height:100vh; overflow:hidden; background:#f4f3f1; }
  .studio-topbar { min-height:72px; }
  .studio-topbar .global-search { height:40px; }
  .legacy-shell-return { grid-column:6; min-height:40px; display:inline-flex; align-items:center; padding:0 14px; color:var(--accent); border:1px solid #d9d5d1; border-radius:4px; text-decoration:none; font:600 9px/1 var(--sans); white-space:nowrap; }
  .legacy-shell-return:hover { border-color:var(--accent); }
  @media (max-width:950px) { .legacy-shell-return { grid-column:4; } }
  .studio-commandbar { min-height:58px; padding:8px 24px; display:flex; align-items:center; gap:8px; background:#fff; border-bottom:1px solid #dfddda; }
  .studio-commandbar .command-group { display:flex; align-items:center; gap:7px; }
  .studio-commandbar .command-group:last-child { margin-left:auto; }
  .studio-commandbar select { min-width:190px; height:36px; padding:0 31px 0 11px; border:1px solid #d8d5d1; border-radius:4px; background:#fff; color:#343236; font:500 10px/1 var(--sans); }
  .studio-commandbar button { min-height:36px; padding:0 12px; border:1px solid #d8d5d1; border-radius:4px; background:#fff; color:#454247; cursor:pointer; font:500 9px/1 var(--sans); white-space:nowrap; }
  .studio-commandbar button:hover { border-color:#aaa6a2; background:#fbfaf9; }
  .studio-commandbar .accent { padding-inline:17px; background:#a92228; border-color:#a92228; color:#fff; }
  .studio-commandbar .accent:hover { background:#8e1b20; border-color:#8e1b20; }
  .studio-commandbar .danger-command { color:#982329; border-color:#d8b9ba; background:#fffafa; }
  .studio-commandbar .danger-command:hover { color:#fff; border-color:#982329; background:#982329; }
  .app { display:grid; grid-template-columns:minmax(430px, 510px) minmax(0, 1fr); height:calc(100vh - 130px); }
  .editor { min-width:0; overflow-y:auto; overflow-x:hidden; background:#fcfbfa; border-right:1px solid #dedbd7; }
  .previewpane { min-width:0; overflow:auto; padding:0 26px 36px; background:#eeece9; }
  .previewscale { transform-origin:top left; }
  .studio-head { position:sticky; top:0; z-index:18; padding:20px 22px 16px; background:rgba(252,251,250,.97); border-bottom:1px solid #e1dedb; backdrop-filter:blur(8px); }
  .studio-head .head-row { display:flex; align-items:baseline; gap:10px; }
  .studio-head strong { display:block; font:400 20px/1 Georgia,'Times New Roman',serif; }
  #kindBadge { display:inline-block; color:var(--accent); font:600 7px/1 var(--code); letter-spacing:1px; }
  #status { margin-top:7px; font:400 9px/1.5 var(--sans); color:#858286; }
  #status[data-tone="success"] { color:#267044; } #status[data-tone="error"] { color:#9a1e25; }
  .preview-head { position:sticky; top:0; z-index:15; height:59px; margin:0 -26px 24px; padding:0 26px; display:flex; align-items:center; justify-content:space-between; background:rgba(250,249,247,.92); border-bottom:1px solid #dedbd7; backdrop-filter:blur(8px); }
  .preview-head strong { font:600 9px/1 var(--sans); text-transform:uppercase; letter-spacing:.7px; }
  .preview-head span { color:#8c898d; font:500 8px/1 var(--code); }
  .editor .panel { width:auto; margin:0; padding:19px 22px; border:0; border-bottom:1px solid #e7e4e1; background:transparent; }
  .panel h3,.collapsible summary { font:600 8px/1 var(--code); text-transform:uppercase; letter-spacing:1.1px; color:#6f6c70; margin:0 0 13px; }
  .collapsible summary { cursor:pointer; margin:0; list-style:none; }
  .collapsible summary::after { content:'+'; float:right; color:#969397; font-size:14px; }
  .collapsible[open] summary { margin-bottom:13px; } .collapsible[open] summary::after { content:'−'; }
  .lbl { display:block; margin:11px 0 5px; font:600 7px/1 var(--code); color:#858286; text-transform:uppercase; letter-spacing:.45px; }
  .in,.ta,.sel { width:100%; border:1px solid #d7d4d0; border-radius:3px; padding:8px 9px; color:var(--ink); background:#fff; font:400 11px/1.4 var(--sans); }
  .in:focus,.ta:focus,.sel:focus { outline:0; border-color:#9d9994; box-shadow:0 0 0 3px rgba(122,30,34,.045); }
  .ta { min-height:76px; resize:vertical; } .sel { height:34px; }
  .two,.color-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .color-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .input-group { min-width:0; }
  .toggle { display:flex; gap:8px; align-items:center; margin:10px 0; font:400 10px/1.35 var(--sans); color:#555258; }
  .toggle input { accent-color:var(--accent); } .toggle.compact { margin:0; min-width:105px; }
  .control-row { display:flex; align-items:center; gap:7px; margin:7px 0; }
  .control-row .in { flex:1; }
  .card { margin:12px 16px; padding:13px; border:1px solid #dedbd7; border-radius:5px; background:#fff; box-shadow:0 3px 12px rgba(42,39,36,.02); }
  .card-head { display:flex; align-items:center; gap:5px; margin-bottom:10px; }
  .card-head .tag { color:#9d2026; background:#fbf2f1; padding:5px 8px; border-radius:3px; font:600 7px/1 var(--code); text-transform:uppercase; letter-spacing:.55px; }
  .editor-card { padding:0; overflow:hidden; }
  .editor-card-summary { min-height:47px; padding:9px 10px 9px 12px; display:flex; align-items:center; gap:6px; list-style:none; cursor:pointer; }
  .editor-card-summary::-webkit-details-marker { display:none; }
  .editor-card-summary .tag { flex:none; color:#9d2026; background:#fbf2f1; padding:5px 8px; border-radius:3px; font:600 7px/1 var(--code); text-transform:uppercase; letter-spacing:.55px; }
  .editor-card-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#4b484d; font:500 10px/1.2 var(--sans); }
  .editor-card-body { padding:2px 13px 14px; border-top:1px solid #eeece9; }
  .collapse-indicator { width:15px; height:15px; flex:none; position:relative; }
  .collapse-indicator::before { content:''; position:absolute; left:4px; top:3px; width:5px; height:5px; border-right:1px solid #777379; border-bottom:1px solid #777379; transform:rotate(45deg); transition:transform .15s ease,top .15s ease; }
  .editor-card[open] .collapse-indicator::before { top:6px; transform:rotate(225deg); }
  .editor-card:not([open]) { box-shadow:none; background:#fdfcfb; }
  .spacer { flex:1; }
  .mini { width:27px; height:27px; border:1px solid #dbd8d4; background:#fff; border-radius:3px; cursor:pointer; color:#656267; }
  .mini:hover { border-color:#aaa6a2; background:#faf9f8; } .mini.del:hover,.danger:hover { background:#9b2328!important; color:#fff!important; }
  .field-editor { display:grid; grid-template-columns:1fr 52px 62px 62px 29px 64px 27px; gap:5px; align-items:center; margin:5px 0; }
  .field-editor .small { text-align:center; padding-inline:3px; }
  .icon-toggle { display:grid; place-items:center; height:31px; border:1px solid #d7d4d0; border-radius:3px; background:#fff; font:600 12px/1 var(--code); }
  .icon-toggle input { position:absolute; opacity:0; } .icon-toggle:has(input:checked) { background:var(--accent); color:#fff; }
  .addrow { margin-top:7px; padding:8px 10px; border:1px dashed #cda9ab; color:var(--accent); background:#fff; border-radius:3px; cursor:pointer; font:600 8px/1 var(--code); }
  .block-picker { margin-top:16px; border-top:1px solid #e5e2df; }
  .block-picker>summary { padding:15px 20px; list-style:none; cursor:pointer; color:#4b484d; font:400 17px/1 Georgia,'Times New Roman',serif; }
  .block-picker>summary::-webkit-details-marker { display:none; }
  .block-picker>summary::after { content:'+'; float:right; color:#969397; font:400 16px/1 var(--sans); }
  .block-picker[open]>summary::after { content:'−'; }
  .addmenu { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; padding:0 16px 20px; }
  .block-group-title { grid-column:1/-1; margin:8px 0 0; color:#858286; font:600 7px/1 var(--code); text-transform:uppercase; letter-spacing:.85px; }
  .block-group-title:first-of-type { margin-top:3px; }
  .addmenu button { min-height:54px; padding:8px 9px; display:grid; grid-template-columns:25px minmax(0,1fr); gap:8px; align-items:center; border:1px solid #dcd9d5; background:#fff; border-radius:4px; cursor:pointer; text-align:left; color:#39373b; }
  .addmenu button strong { display:block; font:500 9px/1.2 var(--sans); }
  .addmenu .block-copy>span { display:block; margin-top:3px; color:#8a878b; font:400 7.5px/1.3 var(--sans); }
  .block-icon { width:25px; height:25px; display:grid; place-items:center; margin:0; color:#646166; border:1px solid #dfdcd8; border-radius:3px; background:#fbfaf9; }
  .block-icon svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.35; stroke-linecap:round; stroke-linejoin:round; }
  .addmenu button:hover { border-color:#b54a4e; background:#fdf9f8; }
  .addmenu button:hover .block-icon { color:#9d2026; border-color:#d9b5b6; background:#fff; }
  .preview-jump { outline:2px solid rgba(157,32,38,.55); outline-offset:5px; animation:preview-jump 1.35s ease both; }
  @keyframes preview-jump { 0%,100% { outline-color:transparent; } 18%,70% { outline-color:rgba(157,32,38,.55); } }
  .wide-action,.modal-primary { padding:9px 11px; border:1px solid #d7d4d0; background:#fff; border-radius:3px; cursor:pointer; font:500 9px/1 var(--sans); }
  .wide-action:hover { border-color:var(--accent); color:var(--accent); } .wide-action { width:100%; }
  .editor-hint,.micro { color:#8f8c90; font:400 9px/1.5 var(--sans); }
  .editor-hint { padding:16px 22px 3px; }
  .package-card strong { display:block; font:600 12px/1.3 var(--sans); } .package-card>span { display:block; margin-top:4px; font:500 8px/1 var(--code); color:#888; text-transform:capitalize; }
  .package-add-grid,.package-card-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:13px; }
  .package-add-grid button { min-height:38px; padding:8px; border:1px solid #d7d4d0; border-radius:3px; background:#fff; color:#4b484d; cursor:pointer; font:500 9px/1.25 var(--sans); }
  .package-add-grid button:hover { border-color:#b54a4e; color:#982329; background:#fdf9f8; }
  .package-card-actions .wide-action { margin:0; }
  .empty-state { margin:16px; padding:24px; text-align:center; color:#8e8b8f; border:1px dashed #d4d1cd; font:400 10px/1.5 var(--sans); }
  .modal { position:fixed; inset:0; z-index:100; } .modal[hidden] { display:none; }
  .modal-backdrop { position:absolute; inset:0; background:rgba(28,26,25,.38); backdrop-filter:blur(2px); }
  .modal-card { position:relative; width:min(820px,calc(100% - 32px)); max-height:82vh; overflow:auto; margin:9vh auto; background:#fff; border:1px solid #d8d5d1; border-radius:7px; box-shadow:0 24px 80px rgba(25,23,22,.22); padding:24px; }
  .modal-head { display:flex; align-items:center; margin-bottom:18px; } .modal-head h2 { margin:0; font:400 23px/1 Georgia,'Times New Roman',serif; } .modal-head button { margin-left:auto; border:0; background:none; font-size:22px; cursor:pointer; }
  .library-tools { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin-bottom:10px; }
  .library-tools button { padding:8px 11px; border:1px solid #ddd; background:#fff; border-radius:3px; cursor:pointer; }
  .library-row { display:grid; grid-template-columns:minmax(0,1fr) repeat(4,auto); gap:7px; align-items:center; padding:12px 0; border-bottom:1px solid #ebe8e5; }
  .library-row strong,.library-row span { display:block; } .library-row span { margin-top:4px; color:#888; font:500 8px/1.3 var(--code); }
  .library-row button { padding:7px 9px; border:1px solid #ddd; background:#fff; border-radius:3px; cursor:pointer; }
  .package-template-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:16px; }
  .package-template-list button { min-height:60px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:16px; border:1px solid #ddd9d5; border-radius:4px; background:#fff; color:#3d3a3f; cursor:pointer; text-align:left; }
  .package-template-list button:hover { border-color:#b54a4e; background:#fdf9f8; }
  .package-template-list strong { font:500 11px/1.25 var(--sans); }
  .package-template-list span { color:#9d2026; font:500 8px/1 var(--code); white-space:nowrap; }
  .modal-text { width:100%; min-height:100px; padding:10px; border:1px solid #ccc; font:500 10px/1.5 var(--code); } .modal-text.tall { min-height:300px; }
  .modal-primary { margin-top:8px; background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:1050px) { .app { grid-template-columns:minmax(390px,460px) minmax(0,1fr); } .studio-commandbar .secondary { display:none; } }
  @media (max-width:760px) { body { overflow:auto; height:auto; } .studio-commandbar { overflow-x:auto; } .app { display:block; height:auto; } .editor { max-height:none; } .previewpane { min-height:70vh; } .addmenu,.package-template-list { grid-template-columns:1fr; } .color-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media print { body { overflow:visible; } .app-topbar,.studio-commandbar,.preview-head { display:none!important; } .app { display:block; height:auto; } .editor,.modal { display:none!important; } .previewpane { overflow:visible; padding:0; background:#fff; } .previewscale { transform:none!important; width:100%!important; } }
</style>
</head>
<body>
<header class="app-topbar studio-topbar">
  <a class="app-brand" href="/dashboard" aria-label="Return to BASE workspace"><img src="assets/base-logo.svg?v=20260718" alt="BASE"></a>
  <span class="app-divider" aria-hidden="true"></span>
  <nav class="app-crumbs" aria-label="Breadcrumb"><a href="/library">Document Library</a><i>/</i><span>Studio</span></nav>
  <form class="global-search" action="/library" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
    <label class="sr-only" for="studioSearch">Search the document workspace</label><input id="studioSearch" name="q" type="search" placeholder="Search documents, templates, or records">
  </form>
  <a class="legacy-shell-return" href="/dashboard">Back to app</a>
</header>
<div class="studio-commandbar">
  <div class="command-group"><select id="templateSelect" aria-label="Document template"></select><button id="newButton">Use template</button></div>
  <div class="command-group secondary"><button id="loadButton" title="Restore a portable document backup file">Import backup</button><button id="downloadButton" title="Download a portable JSON backup">Export backup</button></div>
  <div class="command-group">
    <button id="libraryButton">Controlled documents</button><button id="shareButton">Share</button><button id="aiButton" class="secondary">AI kit</button><button id="aiImportButton" class="secondary">Import AI</button>
    <button id="printButton">Export PDF</button><button id="deleteButton" class="danger-command" title="Delete the current document from the shared library" hidden>Delete</button><button id="updateTemplateButton" class="accent" title="Publish your changes as the new version of this template for everyone" hidden>Update template</button><button id="saveButton" class="accent" title="Save or update this document in the shared Cloudflare library">Save to library</button>
  </div>
</div>
<div class="app">
  <section class="editor" aria-label="Document editor">
    <div class="studio-head"><div class="head-row"><strong>Structure &amp; settings</strong><span id="kindBadge"></span></div><div id="status">Drafts save locally; Save to library publishes to the shared workspace.</div></div>
    <div id="ed"></div>
  </section>
  <main class="previewpane"><div class="preview-head"><strong>Live preview</strong><span>Changes save locally</span></div><div class="previewscale" id="pv"></div></main>
</div>
<div class="modal" id="modal" hidden><div class="modal-backdrop"></div><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button data-action="close-modal" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<script src="engine.js"></script>
<script src="library-api.js"></script>
<script src="template-api.js"></script>
<script src="global-search.js"></script>
<script src="studio.js"></script>
</body>
</html>
