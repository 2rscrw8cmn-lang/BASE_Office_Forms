<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASE — Document Studio</title>
<link rel="icon" type="image/svg+xml" href="assets/base-logo.svg">
<link rel="stylesheet" href="base.css">
<style>
  body { background:#ededf0; overflow:hidden; }
  .app { display:grid; grid-template-columns:minmax(390px, 440px) minmax(0, 1fr); height:100vh; }
  .editor { min-width:0; overflow-y:auto; overflow-x:hidden; background:#fff; border-right:1px solid #d8d8dc; }
  .previewpane { min-width:0; overflow:auto; padding:26px; background:var(--page-bg); }
  .previewscale { transform-origin:top left; }
  .bar { position:sticky; top:0; z-index:20; width:auto; margin:0; padding:10px; background:#17171a; gap:6px; }
  .bar select { min-width:155px; flex:1; background:#fff; border:0; border-radius:3px; padding:7px; font:600 10px/1 var(--code); }
  .bar button { border-color:#44444b; background:#26262b; color:#eee; border-radius:3px; padding:8px 9px; }
  .bar button:hover { background:#3a3a40; }
  .bar .accent { background:var(--accent); border-color:var(--accent); }
  .studio-head { padding:13px 14px 9px; border-bottom:1px solid #ececee; }
  .studio-head strong { display:block; font:800 18px/1 var(--sans); text-transform:uppercase; }
  #kindBadge { display:inline-block; margin-top:7px; color:var(--accent); font:700 8px/1 var(--code); letter-spacing:1.2px; }
  #status { margin-top:7px; font:500 9px/1.4 var(--code); color:#88888f; }
  #status[data-tone="success"] { color:#267044; } #status[data-tone="error"] { color:#9a1e25; }
  .editor .panel { width:auto; margin:0; padding:14px; border:0; border-bottom:1px solid #ececee; }
  .panel h3, .collapsible summary { font:700 9px/1 var(--code); text-transform:uppercase; letter-spacing:1.2px; color:#7f7f87; margin:0 0 10px; }
  .collapsible summary { cursor:pointer; margin:0; }
  .collapsible[open] summary { margin-bottom:10px; }
  .lbl { display:block; margin:9px 0 3px; font:600 8px/1 var(--code); color:#85858c; text-transform:uppercase; letter-spacing:.5px; }
  .in,.ta,.sel { width:100%; border:1px solid #d2d2d6; border-radius:3px; padding:6px 8px; color:var(--ink); background:#fff; font:500 12px/1.35 var(--sans); }
  .ta { min-height:70px; resize:vertical; } .sel { height:31px; }
  .two,.color-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .input-group { min-width:0; }
  .toggle { display:flex; gap:7px; align-items:center; margin:8px 0; font:600 10px/1.3 var(--sans); color:#55555c; }
  .toggle input { accent-color:var(--accent); } .toggle.compact { margin:0; min-width:105px; }
  .control-row { display:flex; align-items:center; gap:7px; margin:6px 0; }
  .control-row .in { flex:1; }
  .card { margin:10px 12px; padding:10px; border:1px solid #e0e0e4; border-radius:5px; background:#fafafb; }
  .card-head { display:flex; align-items:center; gap:5px; margin-bottom:8px; }
  .card-head .tag { color:#fff; background:var(--accent); padding:4px 7px; border-radius:3px; font:700 8px/1 var(--code); text-transform:uppercase; letter-spacing:.6px; }
  .spacer { flex:1; }
  .mini { width:25px; height:25px; border:1px solid #d2d2d6; background:#fff; border-radius:3px; cursor:pointer; }
  .mini:hover { background:#eee; } .mini.del:hover,.danger:hover { background:#8b2529!important; color:#fff!important; }
  .field-editor { display:grid; grid-template-columns:1fr 52px 62px 28px 26px; gap:5px; align-items:center; margin:5px 0; }
  .field-editor .small { text-align:center; padding-inline:3px; }
  .icon-toggle { display:grid; place-items:center; height:29px; border:1px solid #d2d2d6; border-radius:3px; background:#fff; font:700 12px/1 var(--code); }
  .icon-toggle input { position:absolute; opacity:0; } .icon-toggle:has(input:checked) { background:var(--accent); color:#fff; }
  .addrow { margin-top:6px; padding:6px 9px; border:1px dashed #c9a5a7; color:var(--accent); background:#fff; border-radius:3px; cursor:pointer; font:600 9px/1 var(--code); }
  .addmenu { display:flex; flex-wrap:wrap; gap:6px; padding:12px 12px 20px; }
  .addmenu button,.wide-action,.modal-primary { padding:7px 9px; border:1px solid #d7d7db; background:#fff; border-radius:3px; cursor:pointer; font:600 9px/1 var(--code); }
  .addmenu button:hover,.wide-action:hover { border-color:var(--accent); color:var(--accent); }
  .wide-action { width:100%; }
  .editor-hint,.micro { color:#929299; font:500 9px/1.45 var(--code); }
  .editor-hint { padding:11px 14px 0; }
  .package-card strong { display:block; font:700 12px/1.3 var(--sans); } .package-card>span { display:block; margin-top:3px; font:500 9px/1 var(--code); color:#888; }
  .empty-state { margin:16px; padding:20px; text-align:center; color:#999; border:1px dashed #d4d4d8; font:500 10px/1.5 var(--code); }
  .modal { position:fixed; inset:0; z-index:100; } .modal[hidden] { display:none; }
  .modal-backdrop { position:absolute; inset:0; background:rgba(0,0,0,.45); }
  .modal-card { position:relative; width:min(680px,calc(100% - 32px)); max-height:80vh; overflow:auto; margin:10vh auto; background:#fff; border-radius:7px; box-shadow:0 20px 70px rgba(0,0,0,.25); padding:18px; }
  .modal-head { display:flex; align-items:center; margin-bottom:13px; } .modal-head h2 { margin:0; font:800 17px/1 var(--sans); text-transform:uppercase; } .modal-head button { margin-left:auto; border:0; background:none; font-size:22px; cursor:pointer; }
  .library-row { display:grid; grid-template-columns:1fr auto auto; gap:7px; align-items:center; padding:10px 0; border-bottom:1px solid #eee; }
  .library-row strong,.library-row span { display:block; } .library-row span { margin-top:3px; color:#888; font:500 9px/1.3 var(--code); }
  .library-row button { padding:7px 9px; border:1px solid #ddd; background:#fff; border-radius:3px; cursor:pointer; }
  .modal-text { width:100%; min-height:100px; padding:9px; border:1px solid #ccc; font:500 10px/1.5 var(--code); } .modal-text.tall { min-height:300px; }
  .modal-primary { margin-top:8px; background:var(--accent); color:#fff; border-color:var(--accent); }
  @media (max-width:900px) { body { overflow:auto; } .app { display:block; height:auto; } .editor { max-height:none; } .previewpane { min-height:70vh; } }
  @media print { body { overflow:visible; } .app { display:block; height:auto; } .editor,.modal { display:none!important; } .previewpane { overflow:visible; padding:0; background:#fff; } .previewscale { transform:none!important; width:100%!important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="editor">
    <div class="bar">
      <select id="templateSelect" aria-label="Document template"></select><button id="newButton">New</button>
      <button id="loadButton">Load JSON</button><button id="downloadButton">Download JSON</button>
      <button id="saveButton">Save</button><button id="libraryButton">Library</button>
      <button id="shareButton">Copy link</button><button id="aiButton">AI kit</button><button id="aiImportButton">Import AI</button>
      <button id="printButton" class="accent">Export PDF</button>
    </div>
    <div class="studio-head"><strong>BASE Document Studio</strong><span id="kindBadge"></span><div id="status">Draft saves automatically in this browser.</div></div>
    <div id="ed"></div>
  </aside>
  <main class="previewpane"><div class="previewscale" id="pv"></div></main>
</div>
<div class="modal" id="modal" hidden><div class="modal-backdrop"></div><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button data-action="close-modal" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<script src="engine.js"></script>
<script src="studio.js"></script>
</body>
</html>
